<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สถานะการขึ้นทะเบียนบัณฑิต</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="container">
        <header>
            <h1>ตรวจสอบสถานะขึ้นทะเบียนบัณฑิต</h1>
            <p>อัปเดตข้อมูลล่าสุด: <span id="last-updated">กำลังโหลด...</span></p>
            <a href="https://www1.reg.kmitl.ac.th/gradapundit/login.php" target="_blank" class="cta-button">
                👉 เข้าสู่ระบบขึ้นทะเบียนบัณฑิต
            </a>
        </header>

        <div class="summary-container">
            <div class="summary-capsule summary-all active" onclick="setFilter('all')" id="cap-all">
                <span class="summary-label">ทั้งหมด</span>
                <span class="summary-value" id="count-all">0</span>
            </div>
            <div class="summary-capsule summary-not-registered" onclick="setFilter('not-registered')" id="cap-not-registered">
                <span class="summary-label">ยังไม่ขึ้นทะเบียน</span>
                <span class="summary-value" id="count-not-registered">0</span>
            </div>
            <div class="summary-capsule summary-unpaid" onclick="setFilter('unpaid')" id="cap-unpaid">
                <span class="summary-label">รอชำระเงิน</span>
                <span class="summary-value" id="count-unpaid">0</span>
            </div>
            <div class="summary-capsule summary-success" onclick="setFilter('success')" id="cap-success">
                <span class="summary-label">ขึ้นทะเบียนสำเร็จ</span>
                <span class="summary-value" id="count-success">0</span>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ค้นหาจากรหัสนักศึกษา หรือ ชื่อ-นามสกุล...">
        </div>

        <div class="table-container">
            <table id="statusTable">
                <thead>
                    <tr>
                        <th data-sort="id" class="sortable asc">รหัสนักศึกษา <span>↑</span></th>
                        <th>ชื่อ - นามสกุล</th>
                        <th data-sort="major" class="sortable">สาขา <span>↕</span></th>
                        <th data-sort="status" class="sortable">สถานะ <span>↕</span></th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="4" class="loading">กำลังโหลดข้อมูล...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
