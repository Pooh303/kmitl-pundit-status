name: Scrape Student Status

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check deadline and disable workflow
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_time=$(TZ=Asia/Bangkok date +%s)
          deadline_time=$(TZ=Asia/Bangkok date -d "2026-09-30 23:59:59" +%s)
          
          if [ $current_time -gt $deadline_time ]; then
            echo "Deadline has passed. Disabling the workflow to save resources."
            gh workflow disable scrape.yml
            echo "skip=true" >> $GITHUB_ENV
          else
            echo "skip=false" >> $GITHUB_ENV
          fi

      - name: Set up Python
        if: env.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        if: env.skip == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        if: env.skip == 'false'
        run: python scraper.py

      - name: Commit and Push changes
        if: env.skip == 'false'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Auto-update data.json" || echo "No changes to commit"
          git push
